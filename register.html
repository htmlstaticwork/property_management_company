<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <title>Create Account — LandLord Portal</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

    <!-- Toggles (Theme/RTL) outside container -->
    <div class="auth-toggles">
        <button id="theme-toggle" class="theme-toggle"></button>
        <button id="rtl-toggle" class="rtl-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3 4 7l4 4" />
                <path d="M4 7h16" />
                <path d="m16 21 4-4-4-4" />
                <path d="M20 17H4" />
            </svg>
        </button>
    </div>

    <div class="auth-card" style="max-width: 520px;">
        <!-- Logo -->
        <div class="auth-logo">
            <a href="index.html" class="logo">
                <div class="logo-monogram">LL</div>
                <span>LandLord</span>
            </a>
        </div>

        <!-- Form content -->
        <div class="form-header">
            <h2 id="register-title">Create Your Account</h2>
            <p>Join the future of residential management today.</p>
        </div>

        <form class="auth-form" id="register-form">
            <div class="input-container">
                <label>Full Name</label>
                <input type="text" placeholder="John Doe" required class="input-with-icon" style="width: 100%; padding: 14px 20px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-base); color: var(--text-primary); margin-bottom: 20px;">
            </div>
            <div class="input-container">
                <label>Email Address</label>
                <div class="input-with-icon">
                    <input type="email" placeholder="john.doe@example.com" required>
                </div>
            </div>
            
            <div id="dynamic-field-container">
                <div class="input-container">
                    <label id="dynamic-label">Number of Properties</label>
                    <div class="input-with-icon">
                        <input type="number" id="dynamic-input" placeholder="e.g. 5" min="1">
                    </div>
                </div>
            </div>

            <div class="input-container">
                <label>Password</label>
                <div class="input-with-icon">
                    <input type="password" id="pw-field" placeholder="••••••••" required>
                    <span class="input-icon" id="toggle-pw">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/><circle cx="12" cy="12" r="3"/></svg>
                    </span>
                </div>
            </div>

            <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 13px;">
                <input type="checkbox" required style="margin-top: 4px;"> 
                <span>I accept the <a href="#" class="auth-link">Terms & Conditions</a> and <a href="#" class="auth-link">Privacy Policy</a></span>
            </label>

            <button type="submit" class="btn auth-btn" id="reg-btn">Create Account</button>
        </form>

        <div class="social-login">
            <div class="social-divider">or signup with</div>
            <div class="social-btns">
                <button class="social-btn google-btn">
                   <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
                   <span>Google</span>
                </button>
                <button class="social-btn apple-btn">
                   <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple">
                   <span>Apple</span>
                </button>
            </div>
        </div>

        <div class="auth-footer">
            Already have an account? <a href="login.html" class="auth-link">Log In</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script>
        const togglePw = document.getElementById('toggle-pw');
        const pwField = document.getElementById('pw-field');
        const eyeIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/><circle cx="12" cy="12" r="3"/></svg>';
        const eyeOffIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';

        togglePw.addEventListener('click', () => {
            const isPassword = pwField.type === 'password';
            pwField.type = isPassword ? 'text' : 'password';
            togglePw.innerHTML = isPassword ? eyeOffIcon : eyeIcon;
        });

        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Registration Successful! Your account has been created.');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
